name: ppc-amigaos binutils

# Builds binutils and gdb for the AmigaOS 4 (PowerPC) target and runs the
# gas and binutils testsuites.  Like the m68k toolchain build, it runs when
# a pull request gets a ci* label (re-add the label to rebuild), or by hand
# from the Actions tab.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

env:
  # Build without texinfo and install no info files.  configure replaces a
  # makeinfo it can't get a version from, so make gets it as well.
  MAKEINFO: "true"

jobs:
  ppc-amigaos:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.label.name, 'ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out binutils-gdb
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install --no-install-recommends \
            bison dejagnu flex g++ gcc libgmp-dev libmpfr-dev make

      - name: Build binutils and gdb
        run: |
          mkdir build
          cd build
          ../configure --target=ppc-amigaos --prefix=/opt/amiga-ppc \
            --disable-werror --disable-nls --without-msgpack \
            --disable-sim --disable-gprofng
          make -j "$(nproc)" MAKEINFO=true

      - name: Run the gas and binutils testsuites
        run: |
          cd build
          make -k -j "$(nproc)" MAKEINFO=true check-gas check-binutils || true
          grep -E '^(# of|FAIL|ERROR)' gas/testsuite/gas.sum binutils/binutils.sum || true
          ! grep -E '^(FAIL|ERROR)' gas/testsuite/gas.sum binutils/binutils.sum
